workflows:
  android-debug-apk:
    name: Marcos & Paola - Debug APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 21

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Verify Gradle and Android environment
        script: |
          java -version
          ./gradlew --version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Build debug APK
        script: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

  android-release-apk:
    name: Marcos & Paola - Release APK
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      java: 21

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Create temporary release keystore
        script: |
          keytool -genkeypair             -v             -keystore "$CM_BUILD_DIR/codemagic-release.jks"             -storetype JKS             -alias upload             -keyalg RSA             -keysize 2048             -validity 10000             -storepass codemagic             -keypass codemagic             -dname "CN=Marcos & Paola, OU=Android, O=Star App, L=, ST=, C=CU"

          export KEYSTORE_PATH="$CM_BUILD_DIR/codemagic-release.jks"
          export STORE_PASSWORD=codemagic
          export KEY_PASSWORD=codemagic

          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$CM_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$CM_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$CM_ENV"

      - name: Build release APK
        script: |
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --stacktrace

    artifacts:
      - app/build/outputs/apk/release/*.apk
      - codemagic-release.jks
