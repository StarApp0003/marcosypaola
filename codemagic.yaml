workflows:
  android-release-apk:
    name: Marcos & Paola - Release APK
    max_build_duration: 60
    environment:
      java: 21

    scripts:
      - name: Verify Release configuration
        script: |
          echo "========================================"
          echo "MARCOS & PAOLA - RELEASE APK"
          echo "========================================"
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle

      - name: Install Gradle 9.3.1
        script: |
          set -e
          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"
          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then
            mkdir -p "$HOME/gradle-download"
            curl -L --fail --retry 3 \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$HOME/gradle-download/gradle.zip"
            rm -rf "$GRADLE_DIR"
            mkdir -p "$HOME/gradle-extract"
            unzip -q -o "$HOME/gradle-download/gradle.zip" -d "$HOME/gradle-extract"
            mv "$HOME/gradle-extract/gradle-${GRADLE_VERSION}" "$GRADLE_DIR"
            rm -rf "$HOME/gradle-extract"
          fi
          export PATH="$GRADLE_DIR/bin:$PATH"
          gradle --version

      - name: Build Release APK
        script: |
          set -e
          GRADLE_VERSION="9.3.1"
          export PATH="$HOME/gradle-$GRADLE_VERSION/bin:$PATH"
          gradle --no-daemon --no-configuration-cache clean assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
